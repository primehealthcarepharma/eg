<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Leadership profile page for Prime Health Care Pharma" />
  <title>Leader Profile | Prime Health Care Pharma</title>
  <link rel="stylesheet" href="css/variables.css" />

  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="assets/icons/logo.jpeg" alt="Prime Health Care Pharma logo" class="brand-logo" />
        <span>Prime Health Care Pharma</span>
      </a>
      <nav id="navbar" class="site-nav">
        <ul>
          <li><a href="index.html#about">About</a></li>

          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙 Dark</button>

      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

    <section class="container" id="leaderDetails">

  <footer class="site-footer">

      <p>© 2026 Prime Health Care Pharma. All rights reserved.</p>
