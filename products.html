<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Prime Health Care Pharma</title>
  <link rel="icon" href="assets/icons/logo.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-page="products">
  <div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <p>Loading Prime Health Care Pharma...</p>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html#hero" class="brand">
        <img src="assets/icons/logo.jpeg" alt="Prime Health Care Pharma logo" class="brand-logo" />
        <span>Prime Health Care Pharma</span>
      </a>
      <nav class="site-nav" id="navbar">
        <ul>
          <li><a href="index.html#hero">Home</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="index.html#services">Services</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
      </div>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="products" id="products" data-aos="fade-up">
      <div class="container section-heading">
        <span>All Products</span>
        <h2>Search and browse our full product catalog.</h2>
        <div class="product-search">
          <input type="search" id="productSearch" placeholder="Search products" aria-label="Search products" />
        </div>
      </div>
      <div class="container product-grid" id="productGrid"></div>
    </section>
  </main>

  <button class="scroll-top hidden" id="scrollTopBtn" aria-label="Scroll to top">↑</button>

  <footer class="site-footer" id="siteFooter" role="contentinfo"></footer>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
